[package]
name = "linux_disk_prune"
version = "0.3.1"
edition = "2021"
rust-version = "1.95"
description = "Fast disk analyzer and safe cleanup assistant for Ubuntu 22.04: GPU treemap desktop app + terminal UI (inspired by tobi/disktree)"
authors = ["saad-git-007 <saadwaraich007@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/saad-git-007/linux_disk_prune"
homepage = "https://github.com/saad-git-007/linux_disk_prune"
keywords = ["disk", "treemap", "cleanup", "ubuntu", "gui"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
signal-hook = "0.3"
anyhow = "1.0.104"
bytesize = "2.7.0"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "x11", "wayland", "default_fonts"] }
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# `cargo install cargo-deb && cargo deb` also works; packaging/build-deb.sh
# builds the same package with only dpkg-deb.
[package.metadata.deb]
name = "linux-disk-prune"
maintainer = "saad-git-007 <saadwaraich007@gmail.com>"
copyright = "2026, saad-git-007. Inspired by disktree (c) Tobi Lütke, MIT."
section = "utils"
priority = "optional"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libegl1 | libgl1"
recommends = "libvulkan1, mesa-vulkan-drivers, pkexec | policykit-1, libglib2.0-bin, fonts-dejavu-core"
extended-description = """\
Scans a directory tree in parallel and shows where the space goes as a \
treemap and a size tree, then finds reclaimable space in known Ubuntu 22.04 \
bloat locations: APT cache, inactive kernels, disabled snap revisions, the \
systemd journal, rotated logs, crash dumps, developer caches (pip, cargo, npm, \
Docker) and project build output. Read-only until you confirm."""
assets = [
    ["target/release/linux_disk_prune", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/linux-disk-prune/README.md", "644"],
    ["LICENSE", "usr/share/doc/linux-disk-prune/copyright", "644"],
    ["packaging/linux-disk-prune.desktop", "usr/share/applications/", "644"],
    ["packaging/linux-disk-prune.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
